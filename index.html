<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site en production</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f19;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e2e8f0;
      overflow: hidden;
      position: relative;
    }

    /* Fond avec léger gradient animé */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse at 20% 50%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(16, 185, 129, 0.06) 0%, transparent 50%);
      animation: ambient 12s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes ambient {
      0% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    .container {
      text-align: center;
      z-index: 1;
      padding: 2rem;
      max-width: 520px;
    }

    /* Animation principale - cercles concentriques */
    .loader {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 2.5rem;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
    }

    .ring:nth-child(1) {
      border-top-color: #38bdf8;
      animation: spin 1.4s linear infinite;
    }

    .ring:nth-child(2) {
      inset: 12px;
      border-right-color: #8b5cf6;
      animation: spin 1.8s linear infinite reverse;
    }

    .ring:nth-child(3) {
      inset: 24px;
      border-bottom-color: #10b981;
      animation: spin 2.2s linear infinite;
    }

    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      background: #38bdf8;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 20px #38bdf8;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.35); opacity: 0.7; }
    }

    /* Badge statut */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #7dd3fc;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }

    .status::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 8px #38bdf8;
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    /* Points animés sous le texte */
    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .dots span {
      width: 8px;
      height: 8px;
      background: #475569;
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }

    .dots span:nth-child(1) { animation-delay: 0s; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { 
        transform: translateY(0); 
        background: #475569;
      }
      40% { 
        transform: translateY(-10px); 
        background: #38bdf8;
      }
    }

    /* Respect de prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .ring, .center-dot, .status::before, .dots span, body::before {
        animation: none;
      }
      .center-dot {
        box-shadow: 0 0 12px #38bdf8;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loader" aria-hidden="true">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="center-dot"></div>
    </div>

    <div class="status">En production</div>

    <h1>Site en construction</h1>
    <p>
      Nous travaillons actuellement sur quelque chose de mieux.<br />
      Revenez bientôt.
    </p>

    <div class="dots" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</body>
</html>
